name: Feature request
description: Request an enhancement to the finance dashboard
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Requested behavior
      description: What should the dashboard do that it does not do today?
      placeholder: "The user can enter a ticker symbol and see an additional graph for that company."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkable statement per line.
      placeholder: |
        - Existing dashboards remain visible
        - Invalid symbols show a clear error
        - Tests cover the new behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - UI components
        - Charts
        - Data service / proxy
        - Time windows
        - Tests / CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Mockups, links, or constraints (optional).
